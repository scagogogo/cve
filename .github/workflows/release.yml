# 发布 CLI 二进制 —— 打 tag 触发
# 推送形如 v* 的 tag 时，goreleaser 跨平台构建并发布 GitHub Release。
# main 分支的持续 CI 见 go-test.yml（测试）与 ci.yml（构建校验）。
#
# AI Agent 可直接从 Release 下载对应平台的预编译二进制运行，
# 也可从源码编译：go install github.com/scagogogo/cve-skills/cmd/cve@<tag>

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser 需要 tag/commit 历史生成 changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.18"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
